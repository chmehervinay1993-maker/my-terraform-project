# Nightly drift detection: opens an issue when real infra != code.
name: Drift detection
on:
schedule:
- cron: "30 2 * * *" # 02:30 UTC = 08:00 IST
workflow_dispatch:
permissions:
contents: read
id-token: write
issues: write
env:
TF_VERSION: "1.13.3"
TF_IN_AUTOMATION: "true"
TF_INPUT: "false"
AWS_REGION: "ap-south-1"
jobs:
drift:
runs-on: ubuntu-latest
strategy:
fail-fast: false
matrix:
environment: [dev, prod]
defaults:
run:
working-directory: environments/${{ matrix.environment }}
steps:
- uses: actions/checkout@v4
- uses: hashicorp/setup-terraform@v3
with:
terraform_version: ${{ env.TF_VERSION }}
terraform_wrapper: false
- uses: aws-actions/configure-aws-credentials@v4
with:
role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
aws-region: ${{ env.AWS_REGION }}
- run: terraform init
- name: Detect drift
id: drift
run: |
set +e
terraform plan -detailed-exitcode -lock=false -no-color > drift.txt
code=$?
set -e
echo "exitcode=$code" >> "$GITHUB_OUTPUT"
# 0 = no changes, 1 = error, 2 = drift
if [ "$code" -eq 1 ]; then cat drift.txt; exit 1; fi
- name: Open issue on drift
if: steps.drift.outputs.exitcode == '2'
uses: actions/github-script@v7
env:
DRIFT_ENV: ${{ matrix.environment }}
with:
script: |
const fs = require('fs');
const env = process.env.DRIFT_ENV;
const plan = fs.readFileSync(`environments/${env}/drift.txt`, 'utf8');
await github.rest.issues.create({
owner: context.repo.owner,
repo: context.repo.repo,
title: `Terraform drift detected in ${env}`,
labels: ['drift'],
body: '```\n' + plan.substring(0, 60000) + '\n```',
});
